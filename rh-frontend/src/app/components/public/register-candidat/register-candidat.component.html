<app-navbar></app-navbar>
<div class="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 py-10 px-4 sm:px-6 lg:px-8">
  <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg p-7">

    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Inscription Candidat</h2>

    <!-- Affichage erreur globale -->
    <div *ngIf="errorMessage" class="mb-5 p-3 bg-red-50 text-red-700 rounded-lg text-sm text-center">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-5">

      <!-- Nom et Prénom -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label for="prenom" class="block text-sm font-medium text-gray-700 mb-1">Prénom *</label>
          <input 
            type="text" 
            id="prenom" 
            name="prenom" 
            [(ngModel)]="formData.prenom"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="nom" class="block text-sm font-medium text-gray-700 mb-1">Nom *</label>
          <input 
            type="text" 
            id="nom" 
            name="nom" 
            [(ngModel)]="formData.nom"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <!-- Email et Mot de passe -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
          <input 
            type="email" 
            id="email" 
            name="email"  
            [(ngModel)]="formData.email"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe *</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="formData.password"
            required
            minlength="6"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <!-- Téléphone et Adresse -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label for="telephone" class="block text-sm font-medium text-gray-700 mb-1">Téléphone *</label>
          <input 
            type="tel" 
            id="telephone" 
            name="telephone"  
            [(ngModel)]="formData.telephone"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="adresse" class="block text-sm font-medium text-gray-700 mb-1">Adresse *</label>
          <input 
            type="text" 
            id="adresse" 
            name="adresse"  
            [(ngModel)]="formData.adresse"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <!-- Upload CV -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Curriculum Vitae (CV) *</label>
        <div 
          class="border-2 border-dashed border-gray-300 rounded-lg p-5 text-center hover:border-blue-400 transition cursor-pointer"
          (click)="fileInput.click()">
          
          <svg class="mx-auto h-10 w-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
          </svg>
          
          <p class="mt-2 text-sm text-gray-600">Cliquez pour télécharger votre CV</p>
          <p class="text-xs text-gray-500 mt-1">PDF, DOC, DOCX • Max 2 Mo</p>
          
          <input 
            #fileInput
            type="file"
            name="cv"  
            accept=".pdf,.doc,.docx"
            (change)="onFileSelected($event)"
            class="hidden">
        </div>
        
        <div *ngIf="selectedFileName" class="mt-2 text-sm text-blue-600 flex items-center">
          <svg class="h-4 w-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          {{ selectedFileName }}
        </div>
      </div>

      <!-- Bouton Submit -->
      <div class="pt-3">
        <button 
          type="submit"
          [disabled]="!isFormValid() || isSubmitting"
          class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-60 disabled:cursor-not-allowed transition">
          
          <span *ngIf="!isSubmitting">Créer mon compte</span>
          
          <span *ngIf="isSubmitting" class="flex items-center">
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.644z"></path>
            </svg>
            Création en cours...
          </span>
        </button>
      </div>

    </form>

  </div>
</div>

<!-- === NOTIFICATION CENTRALE PROFESSIONNELLE === -->
@if (showModal) {
<div class="notification-container">
  <div class="notification-box">
    <div class="notification-icon">
      <!-- Icône succès animée -->
      @if(modalType === 'success') {
        <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
          <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none" stroke="#28a745" />
          <path class="checkmark__check" fill="none" stroke="#28a745" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
        </svg>
      }

      <!-- Icône erreur -->
      @if(modalType === 'error') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-red-500 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M3 12a9 9 0 1118 0 9 9 0 01-18 0z" />
        </svg>
      }
    </div>
    <h3 class="notification-title">{{ modalTitle }}</h3>
    <p class="notification-message">{{ modalMessage }}</p>
    <button (click)="closeModal()" class="notification-button">OK</button>
  </div>
</div>
}
