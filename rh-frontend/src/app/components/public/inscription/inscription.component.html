<app-navbar></app-navbar>
<div class="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 flex items-center justify-center p-4">
  <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-6">

    <!-- Card Candidat -->
    <div class="bg-white rounded-2xl shadow-lg p-6 flex flex-col items-center transition-all duration-300 hover:shadow-xl hover:-translate-y-1">
      <h2 class="text-3xl font-extrabold text-blue-900 mb-2">Candidat</h2>
      <p class="text-gray-600 text-center mb-4 text-sm max-w-xs">Trouvez votre prochain emploi en quelques clics.</p>
      <div #candidatAnim id="candidat-animation" class="w-full h-64 mb-4"></div>
      <button 
        (click)="navigateToCandidat()"
        class="px-6 py-3 text-sm font-medium text-white bg-blue-900 rounded-lg shadow hover:bg-blue-800 hover:shadow-md transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 uppercase tracking-wide">
        S'inscrire comme candidat
      </button>
    </div>

    <!-- Card Recruteur -->
    <div class="bg-white rounded-2xl shadow-lg p-6 flex flex-col items-center transition-all duration-300 hover:shadow-xl hover:-translate-y-1">
      <h2 class="text-3xl font-extrabold text-blue-900 mb-2">Recruteur</h2>
      <p class="text-gray-600 text-center mb-4 text-sm max-w-xs">Trouvez les meilleurs talents pour votre entreprise.</p>
      <div #recruteurAnim id="recruteur-animation" class="w-full h-64 mb-4"></div>
      <button 
        (click)="navigateToRecruteur()"
        class="px-6 py-3 text-sm font-medium text-white bg-blue-900 rounded-lg shadow hover:bg-blue-800 hover:shadow-md transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 uppercase tracking-wide">
        S'inscrire comme recruteur
      </button>
    </div>

  </div>
</div>
